[bar/top_middle2]
width = 24.5%
height = 20pt
radius = 0
bottom = false
; dpi = 96
offset-x = 64.61%
#offset-y = 3pt

background = ${colors.background}
foreground = ${colors.foreground}

#line-size = 2pt

border-size = 3pt
border-bottom-size = 0pt
border-left-size = 0pt
border-right-size = 0pt
#border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

#separator = |
#separator-foreground = ${colors.foreground}

font-0 = TerminessNerdFontPropo:size=12;3
#font-0 = TerminusRegular:size=12;2
#font-0 = HackNerdFontPropo:size=13;2
#font-0 = DejaVuSansMono:size=12;2
#font-0 = MononokiNerdFont-Bold:size=11;2
