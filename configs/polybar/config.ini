[bar/top_right]
width = 10.73%
height = 20pt
radius = 0
bottom = false
; dpi = 96
offset-x = 89.3%
#offset-y = 3pt

background = ${colors.background}
foreground = ${colors.foreground}

#line-size = 2pt

border-size = 3pt
border-bottom-size = 0pt
border-left-size= 0pt

padding-left = 1
padding-right = 1

module-margin = 1

#separator = |
#separator-foreground = ${colors.foreground}

font-0 = TerminessNerdFontPropo:size=12;3
#font-0 = TerminusRegular:size=12;2
#font-0 = HackNerdFontPropo:size=13;2
#font-0 = DejaVuSansMono:size=12;2
#font-0 = MononokiNerdFont-Bold:size=11;2
#font-0 = FontAwesome:size=12;2
#font-0 = 0xProtoNerdFont:size=12;2

modules-center = xkeyboard date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


[module/bspwm]
type = internal/bspwm

; Only show workspaces defined on the same output as the bar
; NOTE: The bspwm and XRandR monitor names must match, which they do by default.
; But if you rename your bspwm monitors with bspc -n this option will no longer
; behave correctly.
; Default: true
pin-workspaces = true

; Output mode flags after focused state label
; Default: false
inline-mode = false

; Create click handler used to focus workspace
; Default: true
enable-click = true

; Create scroll handlers used to cycle workspaces
; Default: true
enable-scroll = false

; Set the scroll cycle direction 
; Default: true
reverse-scroll = false

; Use fuzzy (partial) matching on labels when assigning 
; icons to workspaces
; Example: code;♚ will apply the icon to all workspaces 
; containing 'code' in the label
; Default: false
fuzzy-match = true

; Only scroll through occupied workspaces
; Default: false
; New in version 3.6.0
occupied-scroll = true

ws-icon-0 = 1; 
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;

; Available tags:
;   <label-monitor>
;   <label-state> - gets replaced with <label-(focused|urgent|occupied|empty)>
;   <label-mode> - gets replaced with <label-(monocle|tiled|fullscreen|floating|locked|sticky|private)>
; Default: <label-state>
format = <label-state> <label-mode>

; Available tokens:
;   %name%
; Default: %name%
label-monitor = %name%

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-focused = %icon%

format-font = 1

label-focused-foreground = ${colors.primary}
#label-focused-background = ${colors.background}
label-focused-overline = ${colors.primary}

#fba922

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-occupied = %icon%
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-underline = ${colors.background}
#555555

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-urgent = %icon%
label-urgent-foreground = ${colors.alert}
#label-urgent-background = #bd2c40
label-urgent-underline = ${colors.alert}

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon% %name%
label-empty = %icon%
label-empty-foreground = #55

; The following labels will be used to indicate the layout/mode
; for the focused workspace. Requires <label-mode>
;
; Available tokens:
;   None
;label-monocle = 
#label-tiled = t
#label-fullscreen = f
;label-floating = f
;label-pseudotiled = P
;label-locked = 
;label-locked-foreground = #bd2c40
;label-sticky = 
;label-sticky-foreground = #fba922
;label-private = 
;label-private-foreground = #bd2c40
;label-marked = M

; Separator in between workspaces
label-separator = |
label-separator-padding = 1
label-separator-foreground = ${colors.background}

[module/xwindow]
type = internal/xwindow
label-font = 2
label-active = %title:0:60:...%
label-maxlen = 95

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = ""
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
format = <label-layout>
label-layout = %icon%
label-layout-foreground = ${colors.foreground}
layout-icon-0 = ru;RU
layout-icon-1 = us;EN

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
label-connected-foreground = ${colors.primary}
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected-prefix-foreground = ${colors.primary}
format-connected-prefix = " "
label-connected-foreground = ${colors.foreground}
label-connected = %ifname%
label-disconnected = 󰖪 :(

[module/eth]
inherit = network-base
interface-type = wired
format-connected-prefix-foreground = ${colors.primary}
format-connected-prefix = "󰛳 "
label-connected-foreground = ${colors.foreground}
label-connected = %ifname%
label-disconnected = 󰅛 :(

[module/date]
type = internal/date
interval = 1
date = %a, %d - %H:%M
date-alt = %d-%m-%Y %H:%M:%S
label-foreground = ${colors.foreground}
label = "%{A1:gsimplecal:}%date%%{A}"

[module/temperature]
type = internal/temperature
; Seconds to sleep between updates
; Default: 1
interval = 1

format-prefix = " "
format-prefix-foreground = ${colors.primary}
; Thermal zone to use
; To list all the zone types, run 
; $ for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; done
; Default: 0
thermal-zone = 0
; Select thermal zone by name
; The name has to match the contents of /sys/class/thermal/thermal_zone*/type
; for the desired thermal zone.
; New in version 3.7.0
; Default: ""
zone-type = x86_pkg_temp
; Full path of temperature sysfs path
; Use `sensors` to find preferred temperature source, then run
; $ for i in /sys/class/hwmon/hwmon*/temp*_input; do echo "$(<$(dirname $i)/name): $(cat ${i%_*}_label 2>/dev/null || echo $(basename ${i%_*})) $(readlink -f $i)"; done
; to find path to desired file
; Default reverts to thermal zone setting
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon2/temp1_input

; Base temperature for where to start the ramp (in degrees celsius)
; Default: 0
base-temperature = 20

; Threshold temperature to display warning label (in degrees celsius)
; Default: 80
#warn-temperature = 60

[module/tray]
type = internal/tray
format-margin = 1px
tray-spacing = 1px

[module/bluetooth]
type = custom/script
label-foreground = ${colors.primary}
exec = ~/.config/polybar/scripts/bt-1/bluetooth.sh
interval = 2
click-left = exec blueman-manager
click-right = exec ~/.config/polybar/scripts/bt-1/toggle_bluetooth.sh
format-padding = 0

[module/redshift]
type = custom/script
exec = ~/.config/polybar/scripts/redshift.sh temperature 
click-left = ~/.config/polybar/scripts/redshift.sh toggle 
interval=1.0

[module/backlight]
type = custom/script
label-foreground = ${colors.primary}
exec = ~/.config/polybar/scripts/brightness.sh current
interval = 2
format-padding = 0

[module/powermenu]
type = custom/text

format = ""
format-background = ${colors.background}
format-foreground = ${colors.primary}

click-left = ~/.config/rofi/powermenu/type-2/powermenu.sh
#click-right = powermenu_t1

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
