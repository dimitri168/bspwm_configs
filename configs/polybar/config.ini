[colors]
background = ${xrdb:color0:#222}
foreground = ${xrdb:color7:#222}
foreground-alt = ${xrdb:color1:#222}
primary = ${xrdb:color4:#222}
secondary = ${xrdb:color2:#222}
alert = ${xrdb:color3:#222}
#background = #282A2E
background-alt = #373B41
#foreground = #C5C8C6
#primary = #F0C674
#secondary = #8ABEB7
#alert = #A54242
disabled = #707880


[bar/top_left]
width = 10.3%
height = 20pt
radius = 0
bottom = false
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 3pt
border-bottom-size = 0pt
border-right-size = 0pt
#offset-x = 0.21%
#offset-y = 3pt

padding-left = 1
padding-right = 1

module-margin = 1

#separator = |
#separator-foreground = ${colors.foreground}

font-0 = FontAwesome:size=12;2
font-1 = TerminessNerdFontPropo:size=12;2
#font-1 = HackNerdFontPropo:size=13;2
#font-2 = DejaVuSansMono:size=12;2
#font-3 = MononokiNerdFont-Bold:size=11;2
#font-5 = 0xProtoNerdFont:size=12;2

modules-center = bspwm

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


[bar/top_middle1]
width = 53.91%
height = 20pt
radius = 0
bottom = false
; dpi = 96

offset-x = 10.5%
#offset-y = 3pt


background = ${colors.background}
foreground = ${colors.foreground}

#line-size = 2pt

border-size = 3pt
border-bottom-size = 0pt
