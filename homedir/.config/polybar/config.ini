include-directory = ~/.config/polybar/modules/

; Config for pywal-controlled colors

[colors]
#background = ${xrdb:color0:#222}
background = #da000000
foreground = ${xrdb:color7:#222}
foreground-alt = ${xrdb:color1:#222}
primary = ${xrdb:color4:#222}
secondary = ${xrdb:color2:#222}
alert = ${xrdb:color3:#222}

[template/bar]
# hide polybar in full window apps
wm-restack = bspwm
background = ${colors.background}
foreground = ${colors.foreground}

border-size = 2pt

font-0 = TerminessNerdFontPropo:size=12;2
font-1 = Hasklug Nerd Font Propo:size=12;1
font-2 = FontAwesome:size=12;2
font-3 = DejaVu Sans Mono:weight=Bold:size=12;2
font-4 = FontAwesome:size=14;3

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/top_left]
inherit = template/bar

width = 12.1%
height = 20pt
radius = 5
bottom = false
; dpi = 96

line-size = 2pt

border-bottom-size = 0pt
border-right-size = 0pt

padding-left = 1
padding-right = 1

module-margin = 1

separator = |

modules-center = jgmenu bspwm

[bar/top_middle1]
inherit = template/bar

width = 62.4%
height = 20pt
radius = 5
bottom = false
; dpi = 96

offset-x = 12.2%
#offset-y = 3pt

border-size = 2pt
border-bottom-size = 0pt
border-left-size = 0pt
border-right-size = 0pt

#border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

modules-left = xwindow
modules-right = tray

[bar/top_middle2]
inherit = template/bar

width = 14.5%
height = 20pt
radius = 5
bottom = false
; dpi = 96

offset-x = 74.7%
#offset-y = 3pt

border-bottom-size = 0pt
border-left-size = 0pt
border-right-size = 0pt
#border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

modules-center = filesystem pulseaudio memory cpu temperature backlight

[bar/top_right]
inherit = template/bar

width = 10.73%
height = 20pt
radius = 5
bottom = false
; dpi = 96

offset-x = 89.3%
#offset-y = 3pt

border-bottom-size = 0pt
border-left-size= 0pt

padding-left = 1
padding-right = 1

module-margin = 1

modules-center = xkeyboard date powermenu

[bar/bottom]
inherit = template/bar

width = 100%
bottom = true
height = 20pt
radius = 5
; dpi = 96

border-bottom-size = 2pt
border-left-size = 2pt
border-right-size = 2pt
border-top-size = 0pt

padding-left = 1
padding-right = 1

module-margin = 1

modules-left = weather
modules-center = mpd
modules-right = eth

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
