border-size = 2pt
border-bottom-size = 0pt
border-right-size = 0pt

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
#separator-foreground = ${colors.foreground}

font-0 = FontAwesome:size=12;2
font-1 = TerminessNerdFontPropo:size=12;2
font-2 = FontAwesome:size=14;3
#font-1 = HackNerdFontPropo:size=13;2
#font-2 = DejaVuSansMono:size=12;2
#font-3 = MononokiNerdFont-Bold:size=11;2
#font-5 = 0xProtoNerdFont:size=12;2

modules-center = jgmenu bspwm

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


